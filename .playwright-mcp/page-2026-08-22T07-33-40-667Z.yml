      - paragraph [ref=f3e420]:
        - text: 所以诚实的总结有两半。
        - strong [ref=f3e421]: 仍然成立的：
        - text: 在五种药中的四种上，模型依然胜过简单的基因查找， 说明核心思路在我们自己的数据之外同样站得住。
        - strong [ref=f3e422]: 不成立的：
        - text: 头孢西丁这个我们最好的内部结果，
        - emphasis [ref=f3e423]: 只是
        - text: 一个内部结果。在别处的细菌上优势几乎消失，而在模型从未见过的家族上，简单查找反而更好。
      - heading "为什么会下降——我们是查证，而不是猜测" [level=3] [ref=f3e424]
      - paragraph [ref=f3e425]:
        - text: 我们首先怀疑的是自己的代码，因为程序出错时表现完全一样。结果并不是：外部基因组平均携带
        - strong [ref=f3e426]: "14.4"
        - text: 个耐药基因，而训练数据是
        - strong [ref=f3e427]: "15.1"
        - text: 个，并且没有任何一个是空的。下降是真实的。
      - paragraph [ref=f3e428]:
        - text: 有两个原因。外部细菌
        - strong [ref=f3e429]: 整体耐药率更低
        - text: ——耐药株比例最多低 27 个百分点，部分原因是我们当初 为训练刻意多收集了耐药株。更值得注意的是，
        - strong [ref=f3e430]: 「近墨者黑」式的关联无法迁移
        - text: ：耐药基因常常搭乘 同一段可移动 DNA 一起传播，所以模型可能在一个人群中学到「这个基因往往伴随耐药」，换一个人群就不成立了。 头孢西丁最依赖这一点——它也正是崩掉的那一个，而基于机制的直接查找却稳住了。
      - generic [ref=f3e431]:
        - generic [ref=f3e432]: 为什么我们乐于报告一个更差的数字
        - paragraph [ref=f3e433]: 我们在知道结果之前，就以书面形式承诺会公布它。几乎没有同类研究会在外部数据上做测试—— 因此「我们测量了它能走多远，答案如实在此」是一个比「再拿自己的数据刷一个更好看的数字」更强的贡献。
  - generic [ref=f3e434]:
    - heading "如果只有两分钟，该怎么讲" [level=2] [ref=f3e435]
    - list [ref=f3e436]:
      - listitem [ref=f3e437]:
        - strong [ref=f3e438]: 问题：
        - text: 要弄清哪些抗生素有效，实验室需要两天。而 DNA 几分钟就能读完。我们能不能从 DNA 预测出实验室的答案？
      - listitem [ref=f3e439]:
        - strong [ref=f3e440]: 我们做了什么：
        - text: 为每种抗生素各建一个独立的预测器，依据的是从基因组中查出的已知耐药基因清单。
      - listitem [ref=f3e441]:
        - strong [ref=f3e442]: 难点在哪：
        - text: 细菌是克隆繁殖的，所以马虎的考法会让模型靠「认家族」而不是靠懂生物学来取胜。我们只在它从未见过的家族上测试——这会拉低我们的数字，而这是刻意为之。
      - listitem [ref=f3e443]:
        - strong [ref=f3e444]: 诚实的对比：
        - text: 对大多数药物，单纯查基因几乎一样好，这一点我们如实报告。而对头孢西丁，查找接近抛硬币，我们的模型达到 0.905——因为那种耐药来自一道
        - emphasis [ref=f3e445]: 缺失
        - text: 的门，而不是新增的武器。
      - listitem [ref=f3e446]:
        - strong [ref=f3e447]: 随后我们拿 1,143 株来自其他团队的细菌做检验，结果变差了
        - text: ——降到 0.80–0.84，头孢西丁一路降到 0.596。我们在知道结果之前就书面承诺会公布它。模型在五种药中的四种上依然胜过基因查找，但它还不能被随便指向任何来源的菌株，这一点我们如实说明。
      - listitem [ref=f3e448]:
        - strong [ref=f3e449]: 每一个答案都有解释，
        - text: 而且它所依据的基因与已知微生物学吻合。
      - listitem [ref=f3e450]:
        - strong [ref=f3e451]: 它不是医疗器械。
        - text: 它是决策辅助；实验室药敏试验始终是最终依据。
    - heading "同事可能会听到我们用的词" [level=3] [ref=f3e452]
    - generic [ref=f3e453]:
      - term [ref=f3e454]: 基因组
      - definition [ref=f3e455]: 细菌的全部 DNA——它完整的说明书。
      - term [ref=f3e456]: 耐药 / 敏感
      - definition [ref=f3e457]: 药物无效 / 药物有效。
      - term [ref=f3e458]: 决定因子
      - definition [ref=f3e459]: 已知会导致对某种特定药物耐药的基因或突变。
      - term [ref=f3e460]: 特征
      - definition [ref=f3e461]: 我们交给计算机的那张清单上的一个「有／无」方框。
      - term [ref=f3e462]: 序列型（ST）
      - definition [ref=f3e463]:
        - text: 近乎相同的细菌所属家族的编号，例如
        - code [ref=f3e464]: ST258
        - text: 。
      - term [ref=f3e465]: 训练
      - definition [ref=f3e466]: 给计算机看成千上万个已知答案的例子，让它自己找出规律。
      - term [ref=f3e467]: 校准
      - definition [ref=f3e468]: 让置信度百分比真正名副其实。
      - term [ref=f3e469]: 极重大误差（VME）
      - definition [ref=f3e470]: 把耐药株判成敏感。危险的那种错误。
      - term [ref=f3e471]: 重大误差（ME）
      - definition [ref=f3e472]: 把敏感株判成耐药。浪费，但不危险。
      - term [ref=f3e473]: ROC-AUC
      - definition [ref=f3e474]: 衡量模型区分两类能力的分数，范围 0.5 到 1.0。0.5 相当于抛硬币。
      - term [ref=f3e475]: 基线
      - definition [ref=f3e476]: 那个简单方法——我们必须胜过它，复杂方法才算有存在理由。
    - paragraph [ref=f3e477]: 本页所有数字均来自项目自身的结果文件，包括第 10 步的外部验证结果（已于 2026 年 8 月 22 日完成）。