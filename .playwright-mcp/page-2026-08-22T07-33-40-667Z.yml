  - generic [ref=f3e301]:
    - generic [ref=f3e302]: "8"
    - generic [ref=f3e303]:
      - heading "与那个最显而易见的简单方法作对比" [level=2] [ref=f3e304]
      - paragraph [ref=f3e305]:
        - text: 下面这个问题，决定了这个项目到底值不值得做：
        - strong [ref=f3e306]: 相比单纯查一下基因，机器学习究竟多带来了什么？
      - paragraph [ref=f3e307]: 你完全可以跳过全部训练，直接写一条规则：「如果这株细菌携带了该药物的已知耐药基因，就判为耐药。」这就是一次数据库查询，而且对某些药物效果非常好。我们把这个基线做了出来，并把它放在每一个结果旁边一起报告——因为如果我们的模型只是跟它打平，那我们不过是造了一张昂贵的查询表。
      - paragraph [ref=f3e308]: 结果确实有好有坏，我们如实说明：
