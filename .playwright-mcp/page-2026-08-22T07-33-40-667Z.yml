      - heading "为什么要把头孢西丁作为头条结果" [level=3] [ref=f3e346]
      - paragraph [ref=f3e347]:
        - text: 在头孢西丁上，基因查找是
        - strong [ref=f3e348]: 几乎无效的
        - text: ——0.518，只比抛硬币略好。它漏掉了
        - strong [ref=f3e349]: 96.3% 的耐药株
        - text: （1,525 株中漏掉 1,469 株）。
      - paragraph [ref=f3e350]:
        - text: 其中的生物学原因非常漂亮。这类细菌对头孢西丁的耐药，往往并不是因为
        - emphasis [ref=f3e351]: 获得
        - text: 了某个防御基因，而是因为
        - emphasis [ref=f3e352]: 失去
        - text: 了一道门——一种叫做孔蛋白的表面蛋白，药物本来要从这里进入细胞。这道门没了，药就进不来了。
      - paragraph [ref=f3e353]:
        - text: 一个只会问「它带了哪些武器？」的查找方法，在结构上就看不见一个
        - strong [ref=f3e354]: 缺失
        - text: 的特征。而我们的模型学会了这种「缺失」的模式，把分数从 0.518 提升到 0.905。
      - generic [ref=f3e355]:
        - generic [ref=f3e356]: 讲给同事听的一句话版本
        - paragraph [ref=f3e357]:
          - text: 「对大多数药物来说，查一下基因清单几乎和我们的模型一样好——这一点我们如实说明。但对头孢西丁，基因清单等同于抛硬币，因为它的耐药来自某种
          - emphasis [ref=f3e358]: 缺失
          - text: 的东西，而不是某种存在的东西——而这正是机器学习真正体现价值的地方。」
  - generic [ref=f3e359]:
    - generic [ref=f3e360]: "9"
    - generic [ref=f3e361]:
      - heading "让每一次预测都可以解释" [level=2] [ref=f3e362]
      - paragraph [ref=f3e363]:
        - text: 一个临床医生无法追问的预测，用处不大。因此对每一次判定，工具都会列出推动这一判定的具体基因，并按各自贡献大小排序——用的是一种标准方法，叫做
        - strong [ref=f3e364]: SHAP
        - text: 。
      - paragraph [ref=f3e365]:
        - text: 这同时也是我们的科学性自查。当我们问模型「你到底依据了什么」时，它给出的正是微生物学界早已熟知的机制：美罗培南对应
        - code [ref=f3e366]: blaKPC
        - text: ，环丙沙星对应
        - code [ref=f3e367]: gyrA
        - text: 和
        - code [ref=f3e368]: parC
        - text: 突变，头孢西丁对应
        - code [ref=f3e369]: ompK36
        - text: 孔蛋白。模型独立地把教科书重新发现了一遍——这有力地说明它学到的是生物学，而不是统计噪声。
      - paragraph [ref=f3e370]:
        - text: 这里有一点我们格外谨慎：某个基因排名靠前，并不能证明它
        - emphasis [ref=f3e371]: 导致
        - text: 了耐药。耐药基因常常搭乘同一段可移动 DNA 一起传播，所以一个基因可能仅仅因为和真正的元凶「同行」而显得重要。我们公开标注这一点，而不是宣称每个排名靠前的基因都是耐药的根源。
  - generic [ref=f3e372]:
    - generic [ref=f3e373]: "10"
