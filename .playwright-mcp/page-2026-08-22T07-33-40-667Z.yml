  - generic [ref=f3e218]:
    - generic [ref=f3e219]: "6"
    - generic [ref=f3e220]:
      - heading "为每种抗生素各训练一个模型" [level=2] [ref=f3e221]
      - paragraph [ref=f3e222]: 现在进入真正的「学习」环节。下面用不带术语的话说明「训练一个模型」到底是什么意思。
      - paragraph [ref=f3e223]:
        - text: 计算机一开始什么都不知道。它逐一查看成千上万个例子——每个例子都是一张基因勾选清单加上实验室的判定——然后逐渐摸索出
        - strong [ref=f3e224]: 哪些勾选组合会对应「耐药」
        - text: 。这是大规模的找规律，而不是推理。
      - paragraph [ref=f3e225]:
        - text: 我们采用的具体方法叫做
        - strong [ref=f3e226]: 梯度提升
        - text: 。它会建立一长串非常简单的「是／否」规则，每一条新规则都专门用来纠正前面那些规则犯过的错。几百次小修小补累加起来，就形成了一个很强的整体判断力。
      - generic [ref=f3e227]:
        - generic [ref=f3e228]: 可以这样理解
        - paragraph [ref=f3e229]: 一名实习生翻阅成千上万份既往病例。每看完一批，带教老师只指出他判错的那些，实习生就补上一条小规则，好让下次不再犯同样的错。如此重复三百遍。没有人事先写好这些规则；它们全是从错误中学出来的。
      - paragraph [ref=f3e230]:
        - text: 有一个刻意的选择值得一提：我们
        - strong [ref=f3e231]: 没有调参
        - text: 。模型上确实有一些旋钮，拧一拧能把分数再挤高一点，但一边盯着自己的测试数据一边拧旋钮，是一种隐蔽的作弊。我们固定了一套合理的配置，对每种药、每个菌种都原样使用。
  - figure "整个循环都只在训练数据内部进行。测试家族只在最后被动用一次。正是这份纪律，让报告出来的数字变得可信。" [ref=f3e232]:
