  - generic [ref=f3e268]:
    - generic [ref=f3e269]: "7"
    - generic [ref=f3e270]:
      - heading "让置信度数字诚实可信，再选定一个安全档位" [level=2] [ref=f3e271]
      - paragraph [ref=f3e272]: 模型并不只是说「耐药」——它会给出一个 0 到 1 之间的数字，也就是置信度。未经处理的置信度通常是不准的：模型可能声称「有 90% 把握」，而实际上这类判断只有 70% 是对的。
      - paragraph [ref=f3e273]:
        - strong [ref=f3e274]: 校准
        - text: 就是用来纠正这一点的。我们调整这些数字，使得模型说 70% 时，它确实大约有 70% 是对的。对于一个临床医生将来可能会依赖的工具来说，一个会说谎的置信度，比根本不给置信度更糟糕。
      - paragraph [ref=f3e275]:
        - text: 接下来我们要决定：把「判为耐药」和「判为敏感」之间的那条线画在哪里。这是一个
        - emphasis [ref=f3e276]: 临床
        - text: 决定，而不是数学决定，因为这两种可能的错误，严重程度并不相同。
  - figure "一个坚决不肯漏掉耐药的工具，必然会把耐药判多。这个取舍是我们刻意做出并公开说明的选择——不是我们藏起来的缺陷。" [ref=f3e277]:
    - img "预测与真实情况的二乘二矩阵。危险的错误是把耐药株判为敏感，这会让病人用上无效的药；代价高的错误是把敏感株判为耐药，这会浪费一种本可使用的药。" [ref=f3e279]:
