- generic [ref=f1e2]:
  - banner [ref=f1e3]:
    - paragraph [ref=f1e4]: 解读耐药 · 通俗版讲解
    - heading "我们如何让计算机读懂细菌基因组，预测哪些抗生素会失效" [level=1] [ref=f1e5]
    - paragraph [ref=f1e6]: 按顺序讲完项目的每一步，不预设任何编程或机器学习基础。本文是为「讲出来」而写的。
  - heading "我们要解决的问题" [level=2] [ref=f1e7]
  - paragraph [ref=f1e8]:
    - text: 当病人发生严重细菌感染时，医生必须知道哪些抗生素真的能杀死这种细菌。细菌常常是
    - strong [ref=f1e9]: 耐药
    - text: 的—— 药物对它已经不起作用了。如果给病人用了一种细菌本就耐药的药，就等于在一个重病患者身上白白浪费了好几天的治疗时间。
  - paragraph [ref=f1e10]:
    - text: 可靠的做法是在实验室里把细菌培养出来，直接拿药去试。这个办法准确，但需要大约
    - strong [ref=f1e11]: 两天
    - text: 。 在这两天里，医生只能靠经验猜。
  - paragraph [ref=f1e12]:
    - text: 而今天读取细菌的 DNA 已经又快又便宜。所以整个项目背后的问题就是：
    - strong [ref=f1e13]: 我们能不能直接读 DNA，把实验室的结论提前预测出来，而不必等实验室？
  - figure [ref=f1e14]:
    - img "从患者样本到答案的两条路线：实验室路线约需两天；基因组路线只需几分钟，并且还会给出每次判定的理由。" [ref=f1e16]:
      - generic [ref=f1e17]: 目前 — 实验室路线
      - generic [ref=f1e19]: 患者样本
      - generic [ref=f1e20]: 培养
      - generic [ref=f1e22]: 培养出菌落
      - generic [ref=f1e23]: ~24 h
      - generic [ref=f1e25]: 逐一测试药物
      - generic [ref=f1e26]: ~24 h
      - generic [ref=f1e28]: 答案
      - generic [ref=f1e29]: ≈ 2 天
      - generic [ref=f1e30]: 本项目 — 基因组路线
      - generic [ref=f1e32]: 患者样本
      - generic [ref=f1e33]: 测序
      - generic [ref=f1e35]: 读取 DNA
      - generic [ref=f1e37]: 我们的模型
      - generic [ref=f1e38]: 几分钟
      - generic [ref=f1e40]: 答案
      - generic [ref=f1e41]: + 判定理由
      - generic [ref=f1e42]: 几分钟
    - generic [ref=f1e43]:
      - text: 实验室路线才是可信的答案，我们并不打算取代它。我们要做的是：在实验室还在培养细菌的时候， 先从 DNA 给出同样的答案——而且与「黑箱」不同，我们还要说明
      - emphasis [ref=f1e44]: 为什么
      - text: 。
  - paragraph [ref=f1e46]:
    - strong [ref=f1e47]: 这句话要早讲、反复讲：
    - text: 这是一个研究工具，不是医疗器械。没有人会依据我们的输出去治疗病人。它只是决策辅助，实验室药敏试验始终是最终依据。
  - heading "十个步骤，按顺序" [level=2] [ref=f1e48]
  - generic [ref=f1e49]:
    - generic [ref=f1e50]: "1"
    - generic [ref=f1e51]:
      - heading "收集已经有实验室答案的基因组" [level=2] [ref=f1e52]
      - paragraph [ref=f1e53]:
        - text: 要教会计算机，就必须有一批「已知正确答案」的例子。我们使用了一个免费公开的数据库
        - strong [ref=f1e54]: BV-BRC
        - text: ，里面收录了世界各地实验室测序
        - emphasis [ref=f1e55]: 并且
        - text: 做过抗生素药敏试验的细菌基因组。
      - paragraph [ref=f1e56]:
        - text: 所以每一个例子都是一对：
        - strong [ref=f1e57]: 一株细菌的完整 DNA
        - text: ，以及
        - strong [ref=f1e58]: 实验室对每种药物的判定
        - text: ——耐药还是敏感。
      - paragraph [ref=f1e59]:
        - text: 这里有一个非常关键的取舍。该数据库里还有一部分判定本身就是
        - emphasis [ref=f1e60]: 由计算机预测出来的
        - text: 。我们把这些全部剔除，只保留真正的实验室结果。用另一台计算机的猜测来训练模型，学到的只是那些猜测，而不是生物学。
      - paragraph [ref=f1e61]:
        - text: 最终我们得到了
        - strong [ref=f1e62]: 3,850 个
        - emphasis [ref=f1e63]: 肺炎克雷伯菌
        - text: 基因组——这是一种严重的医院病原菌——之后又把整套流程在另外七个菌种上重复了一遍。
  - generic [ref=f1e64]:
    - generic [ref=f1e65]: "2"
    - generic [ref=f1e66]:
      - heading "剔除质量不合格的基因组" [level=2] [ref=f1e67]
      - paragraph [ref=f1e68]: DNA 测序并不完美。有些基因组测出来是不完整的，或者混进了样本中其他生物的 DNA。如果把这些数据喂进去，教给计算机的就只是噪声。
      - paragraph [ref=f1e69]:
        - text: 因此我们采用了微生物学界已有共识的质量清单：基因组完整度至少 90%，污染率不超过 5%，且大小要落在
        - emphasis [ref=f1e70]: 克雷伯菌
        - text: 基因组应有的范围内。任何一项不达标的都被剔除。
      - paragraph [ref=f1e71]:
        - text: 这一步删掉了约
        - strong [ref=f1e72]: 2%
        - text: 的基因组——更重要的是，它在耐药株和敏感株中删除的比例是相同的，因此没有悄悄让数据产生偏倚。
  - generic [ref=f1e73]:
    - generic [ref=f1e74]: "3"
    - generic [ref=f1e75]:
      - heading "把每个基因组变成一张简单的清单" [level=2] [ref=f1e76]
      - paragraph [ref=f1e77]: 一个基因组包含数百万个 DNA 字母——直接丢给计算机，原始信息量实在太大。我们需要把它压缩成有意义的东西。
      - paragraph [ref=f1e78]:
        - text: 幸运的是，科学家早已把「哪些基因和突变会让细菌对哪种药耐药」编成了目录。美国国立卫生研究院提供的免费工具
        - strong [ref=f1e79]: AMRFinderPlus
        - text: 可以扫描一个基因组，报告它携带了目录中的哪些已知耐药特征。
      - generic [ref=f1e80]:
        - generic [ref=f1e81]: 可以这样理解
        - paragraph [ref=f1e82]: 把每株细菌想象成一个小偷，把抗生素想象成一把锁。科学家已经把「能撬开哪把锁的作案工具」登记成册。AMRFinderPlus 打开小偷的工具包，逐项勾出里面有哪些工具。我们不是把整个工具包交给计算机——我们交给它的是那张勾选清单。
      - paragraph [ref=f1e83]:
        - text: 于是每个基因组变成一行
        - strong [ref=f1e84]: 688 个「有／无」方框
        - text: ：它带
        - code [ref=f1e85]: blaKPC-2
        - text: 吗？有。带
        - code [ref=f1e86]: gyrA_S83I
        - text: 吗？没有。以此类推。计算机真正学习的就是这张勾选表——而且因为每个方框都对应一个真实的生物学名称，我们事后永远能解释一次预测是怎么来的。
  - figure [ref=f1e87]:
