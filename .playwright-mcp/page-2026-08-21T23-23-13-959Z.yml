  - generic [ref=f1e123]:
    - generic [ref=f1e124]: "4"
    - generic [ref=f1e125]:
      - heading "弄清楚哪些细菌是「亲戚」" [level=2] [ref=f1e126]
      - paragraph [ref=f1e127]: 这一步看上去像是整理档案，实际上却是整个项目的核心。
      - paragraph [ref=f1e128]:
        - text: 细菌靠自我复制来繁殖。这意味着现实中收集到的这批细菌并不是 3,850 个彼此独立的个体——而是
        - strong [ref=f1e129]: 一个个几乎完全相同的「双胞胎大家族」
        - text: 。一株在医院里传播开来的成功菌株，可能就贡献了数百个本质上是同一个生物体的样本。
      - paragraph [ref=f1e130]:
        - text: 有一种标准方法可以判断每株细菌属于哪个家族，叫做
        - strong [ref=f1e131]: MLST
        - text: 。它读取七个特定的管家基因，给出一个家族编号——即「序列型」，写作
        - code [ref=f1e132]: ST258
        - text: 、
        - code [ref=f1e133]: ST307
        - text: 等等。我们对每个基因组都跑了一遍。结果这 3,850 个基因组分属
        - strong [ref=f1e134]: 513 个家族
        - text: 。
  - generic [ref=f1e135]:
    - generic [ref=f1e136]: "5"
    - generic [ref=f1e137]:
      - heading "按家族划分数据——整个项目最重要的一个决定" [level=2] [ref=f1e138]
      - paragraph [ref=f1e139]: 要判断一个模型好不好，做法是在训练时藏起一部分数据，之后再用这部分被藏起来的数据去考它。这是标准做法。
      - paragraph [ref=f1e140]:
        - text: 但
        - emphasis [ref=f1e141]: 怎么选
        - text: 要藏哪一部分，会彻底改变结论。最直觉的做法——把所有数据打乱、随机取 30%——在这里是严重错误的。这一点是你的同事最需要理解的。
      - generic [ref=f1e142]:
        - generic [ref=f1e143]: 可以这样理解
        - paragraph [ref=f1e144]:
          - text: 设想你要用一场考试来判断一个学生是否真的懂医学。如果你把一家同卵双胞胎拆开——一部分放进复习材料，他们的双胞胎兄弟放进考卷——那么这个学生靠
          - emphasis [ref=f1e145]: 认脸
          - text: 就能考出高分，完全不需要学过任何医学。要考出他真正掌握了什么，就必须用
          - strong [ref=f1e146]: 他从未见过的家族
          - text: 来考他。
      - paragraph [ref=f1e147]: 所以我们按家族划分：同一个序列型的所有基因组，要么全部进入训练集，要么全部进入测试集，绝不同时出现在两边。这样模型只会在它真正从未见过的谱系上接受评判。
      - paragraph [ref=f1e148]:
        - text: 这会让我们的数字
        - emphasis [ref=f1e149]: 看起来不如
        - text: 大多数已发表的论文——那些论文通常使用随机划分。但这正是重点。我们宁愿报告一个真实的数字，也不要一个好看的数字。我们还写了一个自动检查：只要有任何一个家族同时出现在两边，整个项目的测试就会失败。
  - figure "我们不只是断言随机划分会虚高结果——我们把它量了出来。同一个模型用两种方式各跑一遍，随机划分在每种药上得分都更高。这个差距，正是模型没有凭本事挣到的那部分分数。" [ref=f1e150]:
    - img "两种数据划分方式的对比。随机划分会把家族拦腰切开，使得近乎相同的「双胞胎」同时出现在训练集和测试集中，让模型靠认家族就能得高分。按家族划分则把整个家族留在同一侧，迫使模型去泛化到它从未见过的谱系。" [ref=f1e152]:
