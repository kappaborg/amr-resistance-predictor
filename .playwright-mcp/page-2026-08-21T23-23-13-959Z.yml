            - cell "明显提升" [ref=f1e337]
          - row [ref=f1e338]:
            - cell [ref=f1e339]:
              - strong [ref=f1e340]: 头孢西丁
            - cell "0.500" [ref=f1e341]
            - cell "0.905" [ref=f1e342]
            - cell [ref=f1e343]:
              - strong [ref=f1e344]: 头条结果——见下文
      - paragraph [ref=f1e345]: （1.0 表示完美，0.5 相当于抛硬币。）
      - heading "为什么要把头孢西丁作为头条结果" [level=3] [ref=f1e346]
      - paragraph [ref=f1e347]:
        - text: 在头孢西丁上，基因查找是
        - strong [ref=f1e348]: 完全无效的
        - text: ——0.500，字面意义上就是抛硬币。它漏掉了
        - strong [ref=f1e349]: 96.6% 的耐药株
        - text: （381 株中漏掉 368 株）。
      - paragraph [ref=f1e350]:
        - text: 其中的生物学原因非常漂亮。这类细菌对头孢西丁的耐药，往往并不是因为
        - emphasis [ref=f1e351]: 获得
        - text: 了某个防御基因，而是因为
        - emphasis [ref=f1e352]: 失去
        - text: 了一道门——一种叫做孔蛋白的表面蛋白，药物本来要从这里进入细胞。这道门没了，药就进不来了。
      - paragraph [ref=f1e353]:
        - text: 一个只会问「它带了哪些武器？」的查找方法，在结构上就看不见一个
        - strong [ref=f1e354]: 缺失
        - text: 的特征。而我们的模型学会了这种「缺失」的模式，把分数从 0.500 提升到 0.905。
      - generic [ref=f1e355]:
        - generic [ref=f1e356]: 讲给同事听的一句话版本
        - paragraph [ref=f1e357]:
          - text: 「对大多数药物来说，查一下基因清单几乎和我们的模型一样好——这一点我们如实说明。但对头孢西丁，基因清单等同于抛硬币，因为它的耐药来自某种
          - emphasis [ref=f1e358]: 缺失
          - text: 的东西，而不是某种存在的东西——而这正是机器学习真正体现价值的地方。」
  - generic [ref=f1e359]:
    - generic [ref=f1e360]: "9"
    - generic [ref=f1e361]:
      - heading "让每一次预测都可以解释" [level=2] [ref=f1e362]
      - paragraph [ref=f1e363]:
        - text: 一个临床医生无法追问的预测，用处不大。因此对每一次判定，工具都会列出推动这一判定的具体基因，并按各自贡献大小排序——用的是一种标准方法，叫做
        - strong [ref=f1e364]: SHAP
        - text: 。
      - paragraph [ref=f1e365]:
        - text: 这同时也是我们的科学性自查。当我们问模型「你到底依据了什么」时，它给出的正是微生物学界早已熟知的机制：美罗培南对应
        - code [ref=f1e366]: blaKPC
        - text: ，环丙沙星对应
        - code [ref=f1e367]: gyrA
        - text: 和
        - code [ref=f1e368]: parC
        - text: 突变，头孢西丁对应
        - code [ref=f1e369]: ompK36
        - text: 孔蛋白。模型独立地把教科书重新发现了一遍——这有力地说明它学到的是生物学，而不是统计噪声。
      - paragraph [ref=f1e370]:
        - text: 这里有一点我们格外谨慎：某个基因排名靠前，并不能证明它
        - emphasis [ref=f1e371]: 导致
        - text: 了耐药。耐药基因常常搭乘同一段可移动 DNA 一起传播，所以一个基因可能仅仅因为和真正的元凶「同行」而显得重要。我们公开标注这一点，而不是宣称每个排名靠前的基因都是耐药的根源。
  - generic [ref=f1e372]:
    - generic [ref=f1e373]: "10"
    - generic [ref=f1e374]:
      - heading "拿完全来自别处的数据来检验它" [level=2] [ref=f1e375]
      - paragraph [ref=f1e376]:
        - text: 以上所有验证用的都是同一个来源的数据。有一条批评始终成立：也许这个模型只在
        - emphasis [ref=f1e377]: 那一批
        - text: 数据上有效。
      - paragraph [ref=f1e378]:
        - text: 因此我们现在正拿完全由其他团队整理的细菌来检验它——而且模型是
        - strong [ref=f1e379]: 冻结
        - text: 的，也就是说：不调整、不重训、没有第二次机会。
      - paragraph [ref=f1e380]:
        - text: 找到真正独立的数据，比听上去难得多。那个最显而易见的来源，其实是
        - emphasis [ref=f1e381]: 汇入
        - text: 我们原始数据库的上游，所以简单地拿来对比，等于又拿模型已经学过的细菌重考了一遍。我们必须先识别并剔除这部分重叠——占候选数据的 16%——之后的结果才有意义。
      - paragraph [ref=f1e382]:
        - text: 而且我们在跑之前就
        - emphasis [ref=f1e383]: 预先承诺
        - text: 了要报告什么：五种药全部报告，无论数字如何，并且额外报告一个更严格的第二队列——其中排除了模型见过的任何细菌家族。如果结果更差，那这就是结论，照样写进报告。
  - generic [ref=f1e384]:
    - heading "如果只有两分钟，该怎么讲" [level=2] [ref=f1e385]
    - list [ref=f1e386]:
      - listitem [ref=f1e387]:
        - strong [ref=f1e388]: 问题：
        - text: 要弄清哪些抗生素有效，实验室需要两天。而 DNA 几分钟就能读完。我们能不能从 DNA 预测出实验室的答案？
      - listitem [ref=f1e389]:
        - strong [ref=f1e390]: 我们做了什么：
        - text: 为每种抗生素各建一个独立的预测器，依据的是从基因组中查出的已知耐药基因清单。
      - listitem [ref=f1e391]:
        - strong [ref=f1e392]: 难点在哪：
        - text: 细菌是克隆繁殖的，所以马虎的考法会让模型靠「认家族」而不是靠懂生物学来取胜。我们只在它从未见过的家族上测试——这会拉低我们的数字，而这是刻意为之。
      - listitem [ref=f1e393]:
        - strong [ref=f1e394]: 诚实的对比：
        - text: 对大多数药物，单纯查基因几乎一样好，这一点我们如实报告。而对头孢西丁，查找等于抛硬币，我们的模型达到 0.905——因为那种耐药来自一道
        - emphasis [ref=f1e395]: 缺失
        - text: 的门，而不是新增的武器。
      - listitem [ref=f1e396]:
        - strong [ref=f1e397]: 每一个答案都有解释，
        - text: 而且它所依据的基因与已知微生物学吻合。
      - listitem [ref=f1e398]:
        - strong [ref=f1e399]: 它不是医疗器械。
        - text: 它是决策辅助；实验室药敏试验始终是最终依据。
    - heading "同事可能会听到我们用的词" [level=3] [ref=f1e400]
    - generic [ref=f1e401]:
      - term [ref=f1e402]: 基因组
      - definition [ref=f1e403]: 细菌的全部 DNA——它完整的说明书。
      - term [ref=f1e404]: 耐药 / 敏感
      - definition [ref=f1e405]: 药物无效 / 药物有效。
      - term [ref=f1e406]: 决定因子
      - definition [ref=f1e407]: 已知会导致对某种特定药物耐药的基因或突变。
      - term [ref=f1e408]: 特征
      - definition [ref=f1e409]: 我们交给计算机的那张清单上的一个「有／无」方框。
      - term [ref=f1e410]: 序列型（ST）
      - definition [ref=f1e411]:
        - text: 近乎相同的细菌所属家族的编号，例如
        - code [ref=f1e412]: ST258
        - text: 。
      - term [ref=f1e413]: 训练
      - definition [ref=f1e414]: 给计算机看成千上万个已知答案的例子，让它自己找出规律。
      - term [ref=f1e415]: 校准
      - definition [ref=f1e416]: 让置信度百分比真正名副其实。
      - term [ref=f1e417]: 极重大误差（VME）
      - definition [ref=f1e418]: 把耐药株判成敏感。危险的那种错误。
      - term [ref=f1e419]: 重大误差（ME）
      - definition [ref=f1e420]: 把敏感株判成耐药。浪费，但不危险。
      - term [ref=f1e421]: ROC-AUC
      - definition [ref=f1e422]: 衡量模型区分两类能力的分数，范围 0.5 到 1.0。0.5 相当于抛硬币。
      - term [ref=f1e423]: 基线
      - definition [ref=f1e424]: 那个简单方法——我们必须胜过它，复杂方法才算有存在理由。
