      - paragraph [ref=f2e420]:
        - text: So the honest summary has two halves.
        - strong [ref=f2e421]: "What survives:"
        - text: the model still beats the simple gene lookup on four of the five drugs, so the core idea holds outside our own data.
        - strong [ref=f2e422]: "What doesn't:"
        - text: the cefoxitin result — our best internal story — is an
        - emphasis [ref=f2e423]: internal
        - text: result only. On bacteria from elsewhere the advantage nearly vanishes, and on families the model has never seen, the simple lookup is actually better.
      - heading "Why it dropped — we checked rather than guessed" [level=3] [ref=f2e424]
      - paragraph [ref=f2e425]:
        - text: "Our first suspicion was our own code, because a broken pipeline looks exactly like this. It wasn't: the external genomes carry"
        - strong [ref=f2e426]: "14.4"
        - text: resistance genes on average against
        - strong [ref=f2e427]: "15.1"
        - text: in our training data, and not one came back empty. The drop is real.
      - paragraph [ref=f2e428]:
        - text: Two things explain it. The external bacteria are simply
        - strong [ref=f2e429]: less resistant overall
        - text: — up to 27 percentage points fewer resistant strains — partly because we had deliberately collected extra resistant ones for training. And more interestingly,
        - strong [ref=f2e430]: guilt-by-association doesn't travel
        - text: ": resistance genes ride together on the same mobile pieces of DNA, so a model can learn \"this gene tends to accompany resistance\" in one population and be wrong in another. Cefoxitin leaned on that the most — and it is exactly the drug that collapsed, while the direct mechanism-based lookup held up."
      - generic [ref=f2e431]:
        - generic [ref=f2e432]: Why we are pleased to report a worse number
        - paragraph [ref=f2e433]: We committed in writing to publishing this result before we knew what it was. Almost no comparable study tests on outside data at all — so "we measured how far it travels, and here is the honest answer" is a stronger contribution than one more flattering number from our own dataset.
  - generic [ref=f2e434]:
    - heading "What to say if you only have two minutes" [level=2] [ref=f2e435]
    - list [ref=f2e436]:
      - listitem [ref=f2e437]:
        - strong [ref=f2e438]: "The problem:"
        - text: finding out which antibiotics work takes two days in a lab. DNA can be read in minutes. Can we predict the lab's answer from the DNA?
      - listitem [ref=f2e439]:
        - strong [ref=f2e440]: "What we built:"
        - text: a separate predictor for each antibiotic, working from a checklist of known resistance genes found in the genome.
      - listitem [ref=f2e441]:
        - strong [ref=f2e442]: "The hard part:"
        - text: bacteria are clones, so a careless test lets the model win by recognising families instead of understanding biology. We tested only on families it had never seen — which lowers our numbers, deliberately.
      - listitem [ref=f2e443]:
        - strong [ref=f2e444]: "The honest comparison:"
        - text: for most drugs, simply looking up the genes is almost as good, and we report that. For cefoxitin the lookup is near a coin flip and our model reaches 0.905, because that resistance comes from a
        - emphasis [ref=f2e445]: missing
        - text: doorway rather than an added weapon.
      - listitem [ref=f2e446]:
        - strong [ref=f2e447]: Then we tested it on 1,143 bacteria from other groups, and it got worse
        - text: — down to 0.80–0.84, and cefoxitin all the way to 0.596. We had committed in writing to publishing that result before we knew it. The model still beats the gene lookup on four of five drugs, but it is not ready to be pointed at isolates from just anywhere, and we say so.
      - listitem [ref=f2e448]:
        - strong [ref=f2e449]: Every answer is explained,
        - text: and the genes it relies on match known microbiology.
      - listitem [ref=f2e450]:
        - strong [ref=f2e451]: It is not a medical device.
        - text: It's decision support; the lab test stays the final word.
    - heading "Words your colleague may hear us use" [level=3] [ref=f2e452]
    - generic [ref=f2e453]:
      - term [ref=f2e454]: Genome
      - definition [ref=f2e455]: The bacterium's complete DNA — its full instruction manual.
      - term [ref=f2e456]: Resistant / susceptible
      - definition [ref=f2e457]: The drug fails / the drug works.
      - term [ref=f2e458]: Determinant
      - definition [ref=f2e459]: A gene or mutation known to cause resistance to a particular drug.
      - term [ref=f2e460]: Feature
      - definition [ref=f2e461]: One yes/no box on the checklist we give the computer.
      - term [ref=f2e462]: Sequence type (ST)
      - definition [ref=f2e463]:
        - text: A family ID for near-identical bacteria, e.g.
        - code [ref=f2e464]: ST258
        - text: .
      - term [ref=f2e465]: Training
      - definition [ref=f2e466]: Showing the computer thousands of solved examples so it finds the patterns.
      - term [ref=f2e467]: Calibration
      - definition [ref=f2e468]: Making the confidence percentages mean what they say.
      - term [ref=f2e469]: Very major error
      - definition [ref=f2e470]: Calling a resistant bug susceptible. The dangerous mistake.
      - term [ref=f2e471]: Major error
      - definition [ref=f2e472]: Calling a susceptible bug resistant. Wasteful, not dangerous.
      - term [ref=f2e473]: ROC-AUC
      - definition [ref=f2e474]: A 0.5-to-1.0 score for how well the model separates the two groups. 0.5 is a coin flip.
      - term [ref=f2e475]: Baseline
      - definition [ref=f2e476]: The simple method we must beat to justify the complicated one.
    - paragraph [ref=f2e477]: All figures on this page come from the project's own results files, including the external-validation results in section 10, which completed on 22 August 2026.