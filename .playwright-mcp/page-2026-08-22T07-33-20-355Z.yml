      - generic [ref=f2e42]: minutes
    - generic [ref=f2e43]:
      - text: The lab route is the trusted answer, and we are not replacing it. We are trying to produce the same answer from DNA while the lab is still growing the culture — and, unlike a black box, to say
      - emphasis [ref=f2e44]: why
      - text: .
  - paragraph [ref=f2e46]:
    - strong [ref=f2e47]: "Say this early and often:"
    - text: this is a research tool, not a medical device. Nobody treats a patient from our output. It is decision support, and the lab test remains the final word.
  - heading "The ten steps, in order" [level=2] [ref=f2e48]
  - generic [ref=f2e49]:
    - generic [ref=f2e50]: "1"
    - generic [ref=f2e51]:
      - heading "Collect genomes that already have lab answers" [level=2] [ref=f2e52]
      - paragraph [ref=f2e53]:
        - text: To teach a computer, you need examples where you already know the right answer. We used a free public database called
        - strong [ref=f2e54]: BV-BRC
        - text: ", which holds bacterial genomes that laboratories around the world have sequenced"
        - emphasis [ref=f2e55]: and
        - text: tested against antibiotics.
      - paragraph [ref=f2e56]:
        - text: "So each example is a pair:"
        - strong [ref=f2e57]: the full DNA of one bacterium
        - text: ", and"
        - strong [ref=f2e58]: the lab's verdict
        - text: — resistant or susceptible — for each drug.
      - paragraph [ref=f2e59]:
        - text: One decision here mattered a lot. The database also contains verdicts that were themselves
        - emphasis [ref=f2e60]: predicted by a computer
        - text: . We excluded every one of those and kept only genuine laboratory results. Training a computer on another computer's guesses teaches it to copy the guesses, not the biology.
      - paragraph [ref=f2e61]:
        - text: We ended up with
        - strong [ref=f2e62]: 3,850 genomes
        - text: of
        - emphasis [ref=f2e63]: Klebsiella pneumoniae
        - text: — a serious hospital pathogen — and later repeated everything for seven more species.
  - generic [ref=f2e64]:
    - generic [ref=f2e65]: "2"
    - generic [ref=f2e66]:
      - heading "Throw out the bad-quality genomes" [level=2] [ref=f2e67]
      - paragraph [ref=f2e68]: DNA sequencing isn't perfect. Some genomes come out incomplete, or contaminated with DNA from a different organism that was in the sample. If we feed those in, we teach the computer nonsense.
      - paragraph [ref=f2e69]:
        - text: "So we applied a quality checklist that microbiologists already agree on: the genome must be at least 90% complete, no more than 5% contaminated, and roughly the size a"
        - emphasis [ref=f2e70]: Klebsiella
        - text: genome should be. Anything failing was dropped.
      - paragraph [ref=f2e71]:
        - text: This removed about
        - strong [ref=f2e72]: 2%
        - text: of the genomes — and importantly, it removed resistant and susceptible ones in equal proportion, so it didn't quietly bias the dataset.
  - generic [ref=f2e73]:
    - generic [ref=f2e74]: "3"
    - generic [ref=f2e75]:
      - heading "Turn each genome into a simple checklist" [level=2] [ref=f2e76]
      - paragraph [ref=f2e77]: A genome is millions of DNA letters — far too much raw material to hand a computer directly. We needed to reduce it to something meaningful.
      - paragraph [ref=f2e78]:
        - text: Fortunately, scientists have already catalogued the specific genes and mutations that make bacteria resistant to specific drugs. A free tool from the US National Institutes of Health,
        - strong [ref=f2e79]: AMRFinderPlus
        - text: ", scans a genome and reports which of those known resistance features it carries."
      - generic [ref=f2e80]:
        - generic [ref=f2e81]: The way to picture it
        - paragraph [ref=f2e82]: Think of each bacterium as a burglar, and the antibiotic as a lock. Scientists have catalogued the burglary tools that open each lock. AMRFinderPlus opens the burglar's bag and ticks off which tools are inside. We don't hand the computer the whole bag — we hand it the checklist.
      - paragraph [ref=f2e83]:
        - text: Every genome becomes a row of
        - strong [ref=f2e84]: 688 yes/no boxes
        - text: ": does it carry"
        - code [ref=f2e85]: blaKPC-2
        - text: "? Yes."
        - code [ref=f2e86]: gyrA_S83I
        - text: "? No. And so on. That grid of ticks is what the computer actually learns from — and because every box has a real biological name, we can always explain a prediction afterwards."
