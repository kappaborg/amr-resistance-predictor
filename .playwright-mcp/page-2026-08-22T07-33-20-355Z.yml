      - heading "Train one model per antibiotic" [level=2] [ref=f2e221]
      - paragraph [ref=f2e222]: Now the actual learning. Here is what "training a model" really means, without jargon.
      - paragraph [ref=f2e223]:
        - text: The computer starts knowing nothing. It looks at thousands of examples — each one a checklist of genes plus the lab's verdict — and gradually works out
        - strong [ref=f2e224]: which combinations of ticks go with "resistant"
        - text: . It is pattern-finding at scale, not reasoning.
      - paragraph [ref=f2e225]:
        - text: The specific method we used is called
        - strong [ref=f2e226]: gradient boosting
        - text: . It builds a long series of very simple yes/no rules, where each new rule is aimed at fixing the mistakes the previous ones made. Hundreds of small corrections add up to a strong overall judgement.
      - generic [ref=f2e227]:
        - generic [ref=f2e228]: The way to picture it
        - paragraph [ref=f2e229]: A trainee reviews thousands of past cases. After each batch, a supervisor points out only the ones they got wrong, and the trainee adds a small rule to catch that mistake next time. Repeat three hundred times. Nobody wrote the rules in advance; they were learned from the errors.
      - paragraph [ref=f2e230]:
        - text: "One deliberate choice worth mentioning: we"
        - strong [ref=f2e231]: did not tune the model's settings
        - text: . There are knobs you can adjust to squeeze out a slightly better score, but adjusting them while looking at your own test data is a subtle way of cheating. We fixed one sensible configuration and used it identically for every drug and every species.
