        - text: for meropenem,
        - code [ref=f2e367]: gyrA
        - text: and
        - code [ref=f2e368]: parC
        - text: mutations for ciprofloxacin, the
        - code [ref=f2e369]: ompK36
        - text: porin for cefoxitin. The model rediscovered the textbook independently — strong evidence it learned biology rather than statistical noise.
      - paragraph [ref=f2e370]:
        - text: "We're careful about one thing here: a gene ranking highly doesn't prove it"
        - emphasis [ref=f2e371]: causes
