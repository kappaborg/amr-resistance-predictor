- generic [ref=f2e2]:
  - banner [ref=f2e3]:
    - paragraph [ref=f2e4]: Reading Resistance · plain-language walkthrough
    - heading "How we taught a computer to read a bacterium's genome and predict which antibiotics will fail" [level=1] [ref=f2e5]
    - paragraph [ref=f2e6]: Every step of the project, in order, with no assumed knowledge of programming or machine learning — including the final test, where the models did worse than we hoped and we published it anyway. Written to be explained out loud.
  - heading "The problem we started from" [level=2] [ref=f2e7]
  - paragraph [ref=f2e8]:
    - text: When someone has a serious bacterial infection, the doctor needs to know which antibiotics will actually kill it. Bacteria are often
    - strong [ref=f2e9]: resistant
    - text: — the drug simply doesn't work on them any more. Give a patient a drug the bug is resistant to and you have lost days of treatment time on a sick person.
  - paragraph [ref=f2e10]:
    - text: The reliable way to find out is to grow the bacterium in a lab and test drugs against it directly. It works, but it takes about
    - strong [ref=f2e11]: two days
    - text: . Meanwhile the doctor has to guess.
  - paragraph [ref=f2e12]:
    - text: "Reading a bacterium's DNA is now fast and cheap. So the question behind this whole project is:"
    - strong [ref=f2e13]: can we read the DNA and predict the lab result, without waiting for the lab?
  - figure [ref=f2e14]:
    - 'img "Two routes from a patient sample to an answer: the laboratory route takes about two days; the genome route takes minutes and also returns the reasons for each call." [ref=f2e16]':
