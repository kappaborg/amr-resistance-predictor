    - generic [ref=f2e125]:
      - heading "Work out which bacteria are relatives" [level=2] [ref=f2e126]
      - paragraph [ref=f2e127]: This step looks like bookkeeping and is actually the heart of the project.
      - paragraph [ref=f2e128]:
        - text: Bacteria reproduce by copying themselves. That means a real-world collection of bacteria isn't 3,850 independent individuals — it's a set of
        - strong [ref=f2e129]: extended families of near-identical twins
        - text: . One successful hospital strain can account for hundreds of samples that are essentially the same organism.
      - paragraph [ref=f2e130]:
        - text: There's a standard way to work out which family each one belongs to, called
        - strong [ref=f2e131]: MLST
        - text: . It reads seven specific housekeeping genes and assigns a family number — a "sequence type", written
        - code [ref=f2e132]: ST258
        - text: ","
        - code [ref=f2e133]: ST307
        - text: and so on. We ran it on every genome. Our 3,850 genomes turned out to belong to
        - strong [ref=f2e134]: 513 families
        - text: .
  - generic [ref=f2e135]:
    - generic [ref=f2e136]: "5"
    - generic [ref=f2e137]:
      - heading "Split the data by family — the single most important decision" [level=2] [ref=f2e138]
      - paragraph [ref=f2e139]: To find out whether a model is any good, you hide some data from it during training, then test it on that hidden data. Standard practice.
      - paragraph [ref=f2e140]:
        - text: But
        - emphasis [ref=f2e141]: how
        - text: you choose what to hide changes everything. The obvious approach — shuffle everything and take a random 30% — is badly wrong here, and this is the point your colleague most needs to understand.
      - generic [ref=f2e142]:
        - generic [ref=f2e143]: The way to picture it
        - paragraph [ref=f2e144]:
          - text: Imagine testing whether a student understands medicine by giving them an exam. If you split a family of identical twins — some in the study set, their twins in the exam — the student can score brilliantly by
          - emphasis [ref=f2e145]: recognising faces
          - text: . They never had to learn any medicine. To find out what they actually understand, you must examine them on
          - strong [ref=f2e146]: families they have never met
          - text: .
      - paragraph [ref=f2e147]: "So we split by family: every genome from a given sequence type goes entirely into training or entirely into testing, never both. The model is then judged only on lineages it has genuinely never seen."
      - paragraph [ref=f2e148]:
        - text: This makes our numbers
        - emphasis [ref=f2e149]: look worse
        - text: than most published papers, which commonly use the random split. That's the point. We would rather report a real number than a flattering one, and we wrote an automated check that fails the whole project if a single family ever appears on both sides.
