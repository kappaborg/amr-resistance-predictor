name: amr-resistance-predictor
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # --- Core Python ---
  - python=3.11
  # --- Data / ML ---
  - pandas>=2.0
  - numpy>=1.24
  - scikit-learn>=1.3
  - xgboost>=2.0
  - lightgbm>=4.0
  - shap>=0.44
  - matplotlib>=3.7
  - pyyaml>=6.0
  # --- Bioinformatics (bioconda) ---
  # AMRFinderPlus is the primary annotation engine; RGI is the CARD alternative.
  # Decide one in Phase 4 (see docs/decisions.md); both listed so the env is ready either way.
  - ncbi-amrfinderplus>=3.12
  - mlst>=2.23
  # - rgi>=6.0            # uncomment if RGI is chosen over AMRFinderPlus
  # --- Dev / testing ---
  - pytest>=7.4
  - jupyterlab>=4.0
  - pip>=23
  - pip:
      - bvbrc-cli ; python_version >= "3.11"   # BV-BRC access; pin exact version in manifest once installed
