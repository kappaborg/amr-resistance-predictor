# Reading Resistance — central run configuration.
# Every pipeline stage reads from here; nothing is hard-coded in scripts.
# Values marked TBD are decided in their phase and logged in docs/decisions.md.

project:
  name: reading-resistance
  seed: 42                     # fixed everywhere for reproducibility

# --- Phase 1: organism & drug selection (data-driven, microbiology sign-off) ---
organism:
  name: Klebsiella pneumoniae
  taxon_id: 573
drugs:                         # 5-drug panel, distinct determinant families (Phase 1 sign-off)
  - meropenem                  # carbapenem — Week-2 flagship (KPC/NDM/OXA-48 + porin loss)
  - gentamicin                 # aminoglycoside (AAC/APH/ANT, armA/rmtB)
  - ciprofloxacin              # fluoroquinolone — Week-1 THIN-SLICE drug (gyrA/parC + qnr)
  - trimethoprim/sulfamethoxazole  # folate pathway (sul1/2/3 + dfrA)
  - cefoxitin                  # cephamycin / AmpC screen (blaCMY/DHA + porin loss)
thin_slice_drug: ciprofloxacin  # clean chromosomal point-mutation signal; de-risks Week-1 gate

# --- Phase 1/2: data acquisition thresholds ---
data:
  source: BV-BRC
  # Phase 1 shortlist thresholds — tuned from the live survey distribution (221 drug-counts):
  # data is abundant (median min(R,S)=191), so balance is the binding quality lever, not count.
  min_genomes_per_class: 150   # per drug, per R/S class (lab phenotypes) — else drop the drug
  min_balance: 0.30            # minority-class fraction min(R,S)/(R+S); >=0.30 = trainable, balanced
  min_total_rs: 300            # minimum R+S lab rows per drug
  max_download_gb: 5           # hard stop-and-flag ceiling before any bulk pull

# --- Phase 3: QC & label harmonization ---
qc:
  # Thresholds VALIDATED against the thin-slice QC distribution (1500 genomes, 99% BV-BRC "Good").
  # Units are CheckM PERCENTAGES (not fractions). "Moderate" tier: drops ~31 (2%), class-balanced.
  # Deliberately NOT stricter — over-strict QC removes lineage diversity and hurts the
  # phylogeny-aware split's generalization (accuracy lever is the split, not tighter QC). ⚕ confirm.
  min_completeness: 95         # CheckM completeness %  (data: p5=99.7, only 3 genomes < 90)
  max_contamination: 5         # CheckM contamination % (data: p95=1.0, 14 genomes > 5, one at 51%)
  max_contigs: 500             # assembly fragmentation (data: p95=309, max 3848)
  genome_length_mbp: [4.8, 6.5]  # K. pneumoniae species sanity ~5.3 Mbp (catches contamination/broken)
label_mapping:
  intermediate: drop           # how MIC/SIR "intermediate" is handled: drop | resistant | susceptible (⚕ decide)

# --- Phase 4: feature extraction ---
features:
  annotator: amrfinderplus     # amrfinderplus | rgi (decide in Phase 4)
  include_point_mutations: true

# --- Phase 5: phylogeny-aware split ---
split:
  method: mlst                 # mlst | phylo_cluster (⚕ decide in Phase 5)
  test_fraction: 0.25          # fraction of *lineages* (not genomes) held out
  # Invariant enforced by tests/test_split.py: no lineage appears in both train and test.

# --- Phase 7/8: modeling ---
model:
  baseline: logistic_regression
  primary: xgboost             # xgboost | lightgbm
  calibration: isotonic        # isotonic | sigmoid(Platt)

# --- Phase 8: evaluation ---
evaluation:
  metrics: [roc_auc, pr_auc, very_major_error, major_error]
  report_clinical_errors_first: true
